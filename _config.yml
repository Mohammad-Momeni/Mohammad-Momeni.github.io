# GitHub Pages / Jekyll configuration for Matin's Workspace.
title: "Mohammad Matin Momeni"
name: "Mohammad Matin Momeni Ravandi"
description: "Computer engineer working across robotics, control, and reliable data systems."
url: "https://mohammad-momeni.github.io"
baseurl: ""
repository: "Mohammad-Momeni/Mohammad-Momeni.github.io"
locale: "en-US"
timezone: Asia/Tehran
encoding: "utf-8"
markdown: kramdown
kramdown:
  input: GFM

include:
  - _pages
  - files
exclude:
  - README.md
  - ARTWORK.md
  - LICENSE
  - Gemfile
  - Gemfile.lock
  - scripts
  - vendor
  - .bundle
  - __pycache__

defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: profile

plugins:
  - jekyll-sitemap
  - jekyll-redirect-from
